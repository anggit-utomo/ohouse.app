services:
    app:
        build: .
        image: ghcr.io/anggit-utomo/ohouse.app:latest
        container_name: budget-app
        restart: unless-stopped
        mem_limit: 700m
        mem_reservation: 512m
        cpus: 1.0
        pids_limit: 128
        env_file: .env
        environment:
            SERVER_NAME: ${APP_DOMAIN}
            # Internal renderer address; never published outside the compose network.
            INERTIA_SSR_URL: http://ssr:13714
        ports:
            - '80:80'
            - '443:443'
            - '443:443/udp'
        volumes:
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            # Soft dependency: wait for the container to start, not for health,
            # so a cold start never blocks the web service on the renderer.
            - ssr
        networks:
            - default
            - shared-net

    ssr:
        image: ghcr.io/anggit-utomo/ohouse.app:latest
        container_name: budget-ssr
        restart: unless-stopped
        mem_limit: 256m
        mem_reservation: 128m
        cpus: 0.4
        env_file: .env
        command: node bootstrap/ssr/ssr.mjs
        expose:
            - '13714'
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:13714/health']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        networks:
            - default

    worker:
        image: ghcr.io/anggit-utomo/ohouse.app:latest
        container_name: budget-worker
        restart: unless-stopped
        mem_limit: 256m
        mem_reservation: 128m
        cpus: 0.5
        env_file: .env
        command: php artisan queue:work --sleep=3 --tries=3 --backoff=10 --max-time=3600
        networks:
            - default
            - shared-net

    scheduler:
        image: ghcr.io/anggit-utomo/ohouse.app:latest
        container_name: budget-scheduler
        restart: unless-stopped
        mem_limit: 128m
        mem_reservation: 64m
        cpus: 0.2
        env_file: .env
        command: php artisan schedule:work
        networks:
            - default
            - shared-net

networks:
    default:
        driver: bridge
    shared-net:
        external: true

volumes:
    caddy_data:
    caddy_config:

services:
    app:
        build: .
        image: ghcr.io/anggit-utomo/ohouse.app:latest
        container_name: budget-app
        restart: unless-stopped
        mem_limit: 700m
        mem_reservation: 512m
        cpus: 1.0
        pids_limit: 128
        env_file: .env
        environment:
            # No SERVER_NAME TLS — TLS at shared VPS Caddy
            INERTIA_SSR_URL: http://ssr:13714
            TRUSTED_PROXIES: '*'
        expose:
            - '80'
        depends_on:
            - ssr
        networks:
            - default
            - shared-net

    ssr:
        image: ghcr.io/anggit-utomo/ohouse.app:latest
        container_name: budget-ssr
        restart: unless-stopped
        mem_limit: 256m
        mem_reservation: 128m
        cpus: 0.4
        env_file: .env
        command: node bootstrap/ssr/ssr.mjs
        expose:
            - '13714'
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:13714/health']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        networks:
            - default

    worker:
        image: ghcr.io/anggit-utomo/ohouse.app:latest
        container_name: budget-worker
        restart: unless-stopped
        mem_limit: 256m
        mem_reservation: 128m
        cpus: 0.5
        env_file: .env
        command: php artisan queue:work --sleep=3 --tries=3 --backoff=10 --max-time=3600
        networks:
            - default
            - shared-net

    scheduler:
        image: ghcr.io/anggit-utomo/ohouse.app:latest
        container_name: budget-scheduler
        restart: unless-stopped
        mem_limit: 128m
        mem_reservation: 64m
        cpus: 0.2
        env_file: .env
        command: php artisan schedule:work
        networks:
            - default
            - shared-net

networks:
    default:
        driver: bridge
    shared-net:
        external: true

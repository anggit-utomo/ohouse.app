services:
    app:
        build: .
        image: localhost/budget-app:latest
        container_name: budget-app
        restart: unless-stopped
        env_file: .env
        environment:
            SERVER_NAME: ${APP_DOMAIN}
            # Internal renderer address; never published outside the compose network.
            INERTIA_SSR_URL: http://ssr:13714
        ports:
            - '80:80'
            - '443:443'
            - '443:443/udp'
        volumes:
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            # Soft dependency: wait for the container to start, not for health,
            # so a cold start never blocks the web service on the renderer.
            - db
            - ssr
        networks:
            - default
            - shared-net

    ssr:
        image: localhost/budget-app:latest
        container_name: budget-ssr
        restart: unless-stopped
        env_file: .env
        command: node bootstrap/ssr/ssr.mjs
        expose:
            - '13714'
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:13714/health']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        networks:
            - default

    worker:
        image: localhost/budget-app:latest
        container_name: budget-worker
        restart: unless-stopped
        env_file: .env
        command: php artisan queue:work --sleep=3 --tries=3 --backoff=10 --max-time=3600
        depends_on:
            - db
        networks:
            - default

    scheduler:
        image: localhost/budget-app:latest
        container_name: budget-scheduler
        restart: unless-stopped
        env_file: .env
        command: php artisan schedule:work
        depends_on:
            - db
        networks:
            - default

    db:
        image: docker.io/library/postgres:17-alpine
        container_name: budget-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - default

networks:
    default:
        driver: bridge
    shared-net:
        external: true

volumes:
    pgdata:
    caddy_data:
    caddy_config:
